# Lint, type check and the vis-2 editor test on every push and pull request;
# a tag like v1.2.3 also publishes the package to npm and creates the GitHub release.

name: Test and Release

on:
    push:
        branches:
            - '*'
        tags:
            # normal versions
            - 'v[0-9]+.[0-9]+.[0-9]+'
            # pre-releases
            - 'v[0-9]+.[0-9]+.[0-9]+-**'
    pull_request: {}

# Cancel previous PR/branch runs when a new commit is pushed
concurrency:
    group: ${{ github.ref }}
    cancel-in-progress: true

jobs:
    check-and-lint:
        if: contains(github.event.head_commit.message, '[skip ci]') == false

        runs-on: ubuntu-latest

        steps:
            - uses: actions/checkout@v7

            - name: Use Node.js 24.x
              uses: actions/setup-node@v7
              with:
                  node-version: 24.x

            - name: Install Dependencies
              run: npm ci && cd src-widgets && npm ci

            - name: Lint
              run: npm run lint

            - name: Type check
              run: cd src-widgets && npx tsc --noEmit -p tsconfig.json

    adapter-tests:
        if: contains(github.event.head_commit.message, '[skip ci]') == false

        runs-on: ubuntu-latest

        steps:
            - uses: actions/checkout@v7

            - name: Use Node.js 24.x
              uses: actions/setup-node@v7
              with:
                  node-version: 24.x

            - name: Install Dependencies
              run: npm ci && cd src-widgets && npm ci

            # the editor test drives Chrome with puppeteer; install it explicitly instead of relying on install scripts
            - name: Install Chrome
              run: npx puppeteer browsers install chrome

            - name: Build widgets
              run: npm run build

            # installs js-controller, web and vis-2, opens the editor and adds every widget
            - name: Run vis-2 editor test
              run: npm test

            - name: Archive screenshots
              if: always()
              uses: actions/upload-artifact@v7
              with:
                  path: tmp/screenshots/**/*.png
                  retention-days: 3

    # Publishes the package to npm and creates the GitHub release; only for tags with a version number
    deploy:
        needs: [check-and-lint, adapter-tests]

        if: |
            contains(github.event.head_commit.message, '[skip ci]') == false &&
            github.event_name == 'push' &&
            startsWith(github.ref, 'refs/tags/v')

        runs-on: ubuntu-latest

        permissions:
            contents: write
            id-token: write

        steps:
            - uses: ioBroker/testing-action-deploy@v1
              with:
                  node-version: '24.x'
                  install-command: 'npm ci && cd src-widgets && npm ci'
                  build: true
                  npm-token: ${{ secrets.NPM_TOKEN }}
                  github-token: ${{ secrets.GITHUB_TOKEN }}
